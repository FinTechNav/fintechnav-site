[build]
  functions = "netlify/functions"
  publish = "."
  command = "npm install"

[build.environment]
  NODE_ENV = "production"

# Apply these headers to static files served by Netlify. Functions and proxy
# responses must supply their own headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
    # Observe resource restrictions before enforcing them: this site uses inline
    # scripts, browser-side Babel, analytics, and several external asset hosts.
    # Violations are visible in browser developer tools; no report collector is
    # configured, so these reports are not sent to a third party.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://static.hotjar.com https://script.hotjar.com https://maps.googleapis.com https://cdn.heavypourwine.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.heavypourwine.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.hotjar.com https://*.hotjar.io wss://*.hotjar.com https://*.heavypourwine.com https://maps.googleapis.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://vars.hotjar.com; media-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[dev]
  command = ""
  port = 8888
  targetPort = 8888

[functions]
  # Directory for functions
  directory = "netlify/functions"
  
  # Enable scheduled functions
  node_bundler = "esbuild"

# Scheduled token refresh - runs daily at 11:00 AM UTC (6:00 AM EST)
[functions."scheduled-token-refresh"]
