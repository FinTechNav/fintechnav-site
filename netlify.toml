[build]
  functions = "netlify/functions"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Apply these headers to static files served by Netlify. Functions and proxy
# responses must supply their own headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://static.hotjar.com https://script.hotjar.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.schwabapi.com https://query1.finance.yahoo.com https://corsproxy.io https://api.allorigins.win https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.hotjar.com https://*.hotjar.io wss://*.hotjar.com https://maps.googleapis.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://vars.hotjar.com; media-src 'self' https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/stock/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[dev]
  command = ""
  port = 8888
  targetPort = 8888

[functions]
  # Directory for functions
  directory = "netlify/functions"
  
  node_bundler = "esbuild"

# Stock API routes and free-plan rate limits are defined in v2 function config.

# RedDay AI Stock App Subpath Routing (https://fintechnav.com/stock)
[[redirects]]
  from = "/stock"
  to = "/stock/index.html"
  status = 200

[[redirects]]
  from = "/stock/"
  to = "/stock/index.html"
  status = 200
